name: deploy-api

# Backend deploys are main-only. PRs run ci.yml but never deploy.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
      - 'fly.toml'
      - 'Dockerfile'
  workflow_dispatch:

# A newer main push supersedes an in-progress deploy instead of racing it.
concurrency:
  group: deploy-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix api

      # Critical: api/Dockerfile COPYs prebuilt dist/ (no in-container build).
      - name: Build API
        run: npm run build --prefix api

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml
