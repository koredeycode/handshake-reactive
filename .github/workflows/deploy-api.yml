name: deploy-api

# Backend deploys are main-only. PRs run ci.yml but never deploy.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
      - 'fly.toml'
      - 'Dockerfile'
  workflow_dispatch:

# A newer main push supersedes an in-progress deploy instead of racing it.
concurrency:
  group: deploy-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 alias resolved read-only 2026-11-28)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 alias resolved read-only 2026-11-28)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix api

      # Critical: api/Dockerfile COPYs prebuilt dist/ (no in-container build).
      - name: Build API
        run: npm run build --prefix api

      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # branch master (no release tag; HEAD 2026-10-30, previously @master)

      - name: Deploy to Fly
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml
