  <path fill-rule="evenodd" clip-rule="evenodd" d="M32 0C49.6731 0 64 14.3269 64 32C64 49.6731 49.6731 64 32 64C14.3269 64 0 49.6731 0 32C0 14.3269 14.3269 0 32 0ZM32 8C18.7452 8 8 18.7452 8 32C8 45.2548 18.7452 56 32 56C45.2548 56 56 45.2548 56 32C56 18.7452 45.2548 8 32 8Z" fill="url(#lasnaGradient)"/>
  <path d="M14 34L34 14V30H50L30 50V34H14Z" fill="#fff"/>
  <defs>
    <linearGradient id="lasnaGradient" x1="64" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62D0FF"/>
      <stop offset="0.5" stop-color="#3C2EFF"/>
