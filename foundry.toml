[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# The Order struct deliberately exposes every field through the auto-generated
# public mapping getter; via-ir keeps that getter within the EVM stack limit.
via_ir = true
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
