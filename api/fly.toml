# One shared-cpu-1x / 256 MB machine runs the Hono API and the 4-chain indexer
# in a single Node process. No keeper key belongs in this app (separate Fly app).
app = 'handshake-api'
primary_region = 'iad'

[build]
  # Build context is this api/ directory; npm install && npm run build run in
  # Fly's Node builder. Start command below uses the compiled output.

[processes]
  app = 'node dist/index.js'

[env]
  PORT = '8080'
  LOG_LEVEL = 'info'
  NODE_OPTIONS = '--max-old-space-size=192'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
